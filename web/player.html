<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    html, body, #host { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: grab; }
    html.dragging, html.dragging body, html.dragging #host { cursor: grabbing; }
    #host canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="host"></div>
  <script src="/player.js"></script>
</body>
</html>
