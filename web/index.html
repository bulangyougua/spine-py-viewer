<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine 动画查看器</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside>
    <div class="brand">Spine 动画查看器</div>
    <div class="tools">
      <button id="open" type="button">添加文件夹</button>
      <button id="refresh" type="button">刷新</button>
    </div>
    <input id="filter" type="search" placeholder="筛选文件名、目录、skel、json">
    <div id="dropHint" class="drop-hint">把文件夹拖到这里添加<br>可以分多次拖入，已有资源会保留</div>
    <div id="folders" class="folders">尚未添加文件夹</div>
    <div id="count" class="count"></div>
    <div id="list" class="list"></div>
    <div class="foot">点击任意资源播放 · 同目录 .skel / .json 配 .atlas</div>
  </aside>
  <main>
    <div class="controls">
      <button id="pause" type="button" class="btn pause" disabled>暂停</button>
      <button id="loop" type="button" class="btn loop" disabled>循环播放</button>
      <label id="skinWrap" class="skin-wrap" hidden>皮肤
        <select id="skin"></select>
      </label>
      <label class="check"><input id="pma" type="checkbox" disabled> 预乘 Alpha</label>
      <span id="now" class="now"></span>
    </div>
    <div id="anims" class="anims"></div>
    <div class="stage">
      <iframe id="frame" title="Spine 画面"></iframe>
      <div id="overlay" class="overlay">把文件夹拖到左侧区域，或点击「添加文件夹」。
可分多次添加不同文件夹，所有 Spine 动画都会保留在同一个列表中。</div>
      <div id="viewHint" class="view-hint hidden">滚轮缩放 · 拖动平移 · 双击适应</div>
      <div class="view-tools">
        <button id="zoomOut" type="button" title="缩小" disabled>−</button>
        <button id="zoomReset" type="button" title="适应画面" disabled>100%</button>
        <button id="zoomIn" type="button" title="放大" disabled>+</button>
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
